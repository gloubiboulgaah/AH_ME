# @format

services:
    db:
        image: postgres:16-alpine
        container_name: ahme-db
        restart: unless-stopped
        environment:
            - POSTGRES_USER=ahme
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ahme}
            - POSTGRES_DB=ahme
        ports:
            - '5432:5432'
        volumes:
            - db-data:/var/lib/postgresql/data
        networks:
            - game-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ahme -d ahme']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    backend:
        build:
            context: ./server
            dockerfile: Dockerfile
        container_name: ahme-backend
        restart: unless-stopped
        ports:
            - '3000:3000'
        environment:
            - NODE_ENV=production
            - PORT=3000
            - CLIENT_URL=${CLIENT_URL:-http://localhost:8080}
            - DATABASE_URL=postgres://ahme:${POSTGRES_PASSWORD:-ahme}@db:5432/ahme
        depends_on:
            db:
                condition: service_healthy
        networks:
            - game-network
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    frontend:
        build:
            context: ./client
            dockerfile: Dockerfile
            args:
                - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3000}
        container_name: ahme-frontend
        restart: unless-stopped
        ports:
            - '8080:3000'
        depends_on:
            - backend
        networks:
            - game-network
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--quiet',
                    '--tries=1',
                    '--spider',
                    'http://localhost:3000/',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

networks:
    game-network:
        driver: bridge
        name: ahme-network

volumes:
    db-data:
        name: ahme-db-data
